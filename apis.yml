name: Haven Connect
description: >-
  Haven Connect is an affordable-housing software company (founded 2014, San
  Jose, CA) that streamlines the affordable-housing application and waitlist
  process for both property managers and low-income applicants. Its web platform
  lets property managers publish waitlists, collect and screen online
  applications, and automate waitlist updates — eliminating paper forms and
  manual data entry — while giving applicants a single portal to find and apply
  for affordable housing. Haven Connect is a Techstars Impact portfolio company
  and has raised roughly $2.9M. It is a SaaS product company with no public
  developer API; this profile captures its public website, support, and
  commercial surfaces for the API Evangelist network.
